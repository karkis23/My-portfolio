# docker-compose.yml — Full Stack Example
# FastAPI + PostgreSQL + Redis
# Run: docker compose up -d

version: '3.9'

services:
  # ---- FastAPI Backend ----
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zenith-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:secret@db:5432/zenith
      - REDIS_URL=redis://cache:6379/0
      - JWT_SECRET=change-this-in-production
      - ENV=development
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    volumes:
      - ./backend:/app         # Hot reload in dev
    restart: unless-stopped

  # ---- PostgreSQL Database ----
  db:
    image: postgres:16-alpine
    container_name: zenith-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=zenith
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---- Redis Cache ----
  cache:
    image: redis:7-alpine
    container_name: zenith-cache
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

  # ---- React Frontend (Production) ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zenith-frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:      # Persistent database storage
  redisdata:   # Persistent cache storage
